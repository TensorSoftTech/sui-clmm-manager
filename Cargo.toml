[workspace]
resolver = "2"
members = [
    "crates/sui-clmm-manager",
    "crates/bluefin",
    "crates/momentum",
    "crates/cetus",
    "crates/turbos",
    "crates/deepbook",
    "crates/router",
    "crates/sui-clmm-client",
    "crates/sui-clmm-tui",
]
default-members = ["crates/sui-clmm-tui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tensorsoft"]
repository = "https://github.com/local/sui-clmm-tui"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6"
crossterm = "0.29"
ratatui = "0.30"
reqwest = { version = "0.12", features = ["blocking", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# workspace crates
sui-clmm-manager = { path = "crates/sui-clmm-manager" }
bluefin = { path = "crates/bluefin" }
momentum = { path = "crates/momentum" }
cetus = { path = "crates/cetus" }
turbos = { path = "crates/turbos" }
deepbook = { path = "crates/deepbook" }
router = { path = "crates/router" }
sui-clmm-client = { path = "crates/sui-clmm-client" }
